{% extends "base.html" %}

{% block title %}Sign In - PocketSmart AI{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto;">
  <div class="glass-panel form-panel">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="logo-icon" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.5rem;">✨</div>
      <h2 style="font-size: 1.85rem; margin-bottom: 0.5rem;">Welcome Back</h2>
      <p style="color: var(--text-secondary); font-size: 0.9rem;">Sign in to access your saved plans and history.</p>
    </div>

    {% if error %}
      <div style="background: rgba(220, 38, 38, 0.15); border: 1px solid rgba(220, 38, 38, 0.4); color: #fca5a5; padding: 0.8rem 1rem; border-radius: var(--radius-sm); margin-bottom: 1.5rem; font-size: 0.9rem;">
        ⚠️ {{ error }}
      </div>
    {% endif %}

    <form action="/login" method="POST">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" name="username" class="form-input" placeholder="Enter your username" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
        Sign In &rarr;
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-secondary);">
      Don't have an account yet? <a href="/register" style="color: #a5b4fc; font-weight: 600;">Create one now</a>
    </div>
  </div>
</div>
{% endblock %}
