{% extends "base.html" %}

{% block title %}Sign Up - PocketSmart AI{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto;">
  <div class="glass-panel form-panel">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="logo-icon" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.5rem;">✨</div>
      <h2 style="font-size: 1.85rem; margin-bottom: 0.5rem;">Create Your Account</h2>
      <p style="color: var(--text-secondary); font-size: 0.9rem;">Start creating intelligent, AI-powered budget plans.</p>
    </div>

    {% if error %}
      <div style="background: rgba(220, 38, 38, 0.15); border: 1px solid rgba(220, 38, 38, 0.4); color: #fca5a5; padding: 0.8rem 1rem; border-radius: var(--radius-sm); margin-bottom: 1.5rem; font-size: 0.9rem;">
        ⚠️ {{ error }}
      </div>
    {% endif %}

    <form action="/register" method="POST">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" name="username" class="form-input" placeholder="e.g. alexdesign" required minlength="3">
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-input" placeholder="alex@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-input" placeholder="At least 6 characters" required minlength="6">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
        Create Account &rarr;
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-secondary);">
      Already have an account? <a href="/login" style="color: #a5b4fc; font-weight: 600;">Sign in here</a>
    </div>
  </div>
</div>
{% endblock %}
